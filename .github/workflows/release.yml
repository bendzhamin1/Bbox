name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Remove old CI log releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep '^cilog-' | while read -r t; do
              gh release delete "$t" --yes --cleanup-tag || true
            done || true

      - name: Show toolchain
        run: |
          swift --version 2>&1 | tee -a build.log
          xcodebuild -version 2>&1 | tee -a build.log || true

      - name: Build app bundle
        run: |
          chmod +x scripts/build_app.sh
          set -o pipefail
          ./scripts/build_app.sh "${GITHUB_REF_NAME#v}" 2>&1 | tee -a build.log

      - name: Zip the app
        run: ditto -c -k --keepParent build/Bbox.app build/Bbox-macOS.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Bbox-macOS.zip \
            --title "Bbox $GITHUB_REF_NAME" \
            --notes "Portable app for macOS. No installer.

          How to run:
          1. Download Bbox-macOS.zip below.
          2. Double click it to unzip. You get Bbox.app.
          3. Right click Bbox.app and choose Open, then Open again. This first step is needed once because the app is not signed with a paid Apple certificate.
          4. The icon appears in the menu bar at the top. Press Option+V to show the clipboard.

          You can keep Bbox.app anywhere, for example in Applications or on the Desktop. It starts automatically when you log in."

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 55000 build.log > taillog.txt || cp build.log taillog.txt
          gh release delete "cilog-${GITHUB_REF_NAME}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "cilog-${GITHUB_REF_NAME}" \
            --title "CI log ${GITHUB_REF_NAME}" \
            --notes-file taillog.txt \
            --prerelease
